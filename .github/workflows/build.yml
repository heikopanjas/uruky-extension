name: Build

on:
  push:
    branches:
      - develop
      - "feature/**"
  pull_request:
    branches:
      - develop
      - "feature/**"

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  build:
    name: Build Signed macOS App
    needs:
      - checks
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build Signed App
        uses: ./.github/actions/build-app
        with:
          certificate-p12-base64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          signing-identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Name Build Artifact
        run: echo "BUILD_NAME=uruky-for-safari-build-${GITHUB_RUN_NUMBER}-$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_ENV"

      - name: Package App
        uses: ./.github/actions/package-app
        with:
          artifact-name: ${{ env.BUILD_NAME }}

      - name: Upload App Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.BUILD_NAME }}
          path: ${{ env.ARTIFACT_ZIP }}
          if-no-files-found: error

      - name: Clean Up Signing Material
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/developer-id-application.p12"
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
